<!-- LIGHT AND DARK. Light is the default (Rose, 28 Sep 2026 — it used to follow the device); dark only
     when someone picks it with the mode key, and that choice is remembered. Runs before the page paints
     so it never flashes the wrong mode. data-mode-now says which one is showing, for the key's icon.
     The stored choice moved to a new name, so a dark picked while it followed the device starts light. -->
<script>
(function () {
  var root = document.documentElement;
  function now() { root.setAttribute('data-mode-now', root.getAttribute('data-mode')); }
  var saved = null; try { saved = localStorage.getItem('finna-mode-choice'); localStorage.removeItem('finna-mode'); } catch (e) {}
  if (saved === 'light' || saved === 'dark') root.setAttribute('data-mode', saved);
  now();
  window.FinnaMode = { set: function (m) { root.setAttribute('data-mode', m); try { localStorage.setItem('finna-mode-choice', m); } catch (e) {} now(); } };
})();
</script>
